<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly SIM Down Report</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --surface: #ffffff;
            --bg: #f1f5f9;
            --text-main: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
            --sim-down: #ffeb3b;
            --non-rtis: #f44336;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 24px;
            line-height: 1.5;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .page-title h1 { margin: 0; font-size: 24px; font-weight: 700; color: #0f172a; }
        .page-title p { margin: 4px 0 0 0; color: var(--text-light); font-size: 14px; }

        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            text-decoration: none;
            color: var(--text-main);
        }
        .btn-primary { background: var(--primary); color: white; border-color: var(--primary); }
        .btn-success { background: var(--success); color: white; border-color: var(--success); }
        .btn:hover { opacity: 0.9; }

        .header-actions { display: flex; gap: 8px; align-items: center; }

        /* Week Picker */
        .week-picker {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--surface);
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .week-picker label { font-weight: 600; font-size: 14px; }
        .week-picker input[type="date"] {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
        }
        .flexible-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: #f8fafc;
            border-radius: 6px;
            border: 1px solid var(--border);
            cursor: pointer;
            font-size: 13px;
            user-select: none;
        }
        .flexible-toggle:hover { background: #f1f5f9; }
        .flexible-toggle input { cursor: pointer; }
        .flexible-toggle.active {
            background: #dbeafe;
            border-color: var(--primary);
            color: var(--primary);
        }
        .week-nav { display: flex; gap: 8px; }
        .week-nav.hidden { display: none; }

        /* Legend */
        .legend {
            display: flex;
            gap: 20px;
            margin-bottom: 16px;
            padding: 12px 16px;
            background: var(--surface);
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        .legend-color.sim-down { background: var(--sim-down); }
        .legend-color.non-rtis { background: var(--non-rtis); }
        .legend-color.ok { background: var(--success); }
        .legend-color.blank { background: #fff; }

        /* Stats */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--surface);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
            text-align: center;
        }
        .stat-card.locos { border-left: 4px solid var(--danger); }
        .stat-card.sim-down { border-left: 4px solid #f59e0b; }
        .stat-card.non-rtis { border-left: 4px solid var(--danger); }

        .stat-value { font-size: 32px; font-weight: 700; }
        .stat-card.locos .stat-value { color: var(--danger); }
        .stat-card.sim-down .stat-value { color: #f59e0b; }
        .stat-card.non-rtis .stat-value { color: var(--danger); }
        .stat-label { font-size: 12px; color: var(--text-light); text-transform: uppercase; margin-top: 4px; }

        /* Table */
        .table-card {
            background: var(--surface);
            border-radius: 8px;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .table-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .table-header h3 { margin: 0; font-size: 16px; }

        .table-wrapper {
            overflow-x: auto;
        }

        table { width: 100%; border-collapse: collapse; min-width: 900px; }

        th, td {
            padding: 10px 12px;
            text-align: center;
            border: 1px solid var(--border);
            font-size: 13px;
        }

        th {
            background: #f8fafc;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-light);
            text-transform: uppercase;
        }

        td:nth-child(1), td:nth-child(2), td:nth-child(3), td:nth-child(4) {
            text-align: left;
        }

        tr:hover { background: #f8fafc; }

        .loco-number {
            font-family: monospace;
            font-weight: 600;
            font-size: 14px;
        }

        /* Status cells */
        .status-cell {
            font-weight: 500;
            font-size: 12px;
            white-space: nowrap;
        }
        .status-cell.sim-down {
            background: var(--sim-down) !important;
            color: #000;
        }
        .status-cell.non-rtis {
            background: var(--non-rtis) !important;
            color: #fff;
        }
        .status-cell.ok {
            background: var(--success) !important;
            color: #fff;
        }
        .status-cell.not-in-beat {
            background: #f1f5f9 !important;
            color: var(--text-light);
        }

        /* Loading / Empty */
        .loading, .empty-state {
            text-align: center;
            padding: 60px 40px;
            color: var(--text-light);
        }
        .empty-state i { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 12px 20px;
            border-radius: 8px;
            background: #1e293b;
            color: white;
            font-size: 14px;
            z-index: 2000;
            display: none;
        }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
        .toast.show { display: block; }

        @media (max-width: 768px) {
            .stats-row { grid-template-columns: 1fr; }
            .week-picker { flex-wrap: wrap; }
        }

        @media print {
            body { padding: 0; background: white; }
            .page-header, .week-picker, .header-actions, .btn { display: none; }
            .table-card { border: none; }
            .stats-row { display: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="page-header">
            <div class="page-title">
                <h1><i class="fas fa-calendar-week"></i> Weekly SIM Down / NON RTIS Report</h1>
                <p>Locos with SIM Down or NON RTIS status during the selected week</p>
            </div>
            <div class="header-actions">
                <a href="daily-summary.html" class="btn"><i class="fas fa-clipboard-list"></i> Daily Summary</a>
                <a href="./" class="btn"><i class="fas fa-arrow-left"></i> Back</a>
            </div>
        </div>

        <!-- Week Picker -->
        <div class="week-picker">
            <label id="dateRangeLabel"><i class="fas fa-calendar"></i> Select Week:</label>
            <input type="date" id="weekStartInput" onchange="handleStartDateChange()">
            <span>to</span>
            <input type="date" id="weekEndInput" onchange="handleEndDateChange()">
            <label class="flexible-toggle" id="flexibleToggle">
                <input type="checkbox" id="flexibleDatesCheckbox" onchange="toggleFlexibleDates()">
                <span>Flexible dates</span>
            </label>
            <div class="week-nav" id="weekNav">
                <button class="btn" onclick="goToPreviousWeek()"><i class="fas fa-chevron-left"></i> Prev</button>
                <button class="btn" onclick="goToCurrentWeek()">This Week</button>
                <button class="btn" onclick="goToNextWeek()">Next <i class="fas fa-chevron-right"></i></button>
            </div>
        </div>

        <!-- Legend -->
        <div class="legend">
            <div class="legend-item">
                <div class="legend-color sim-down"></div>
                <span>SIM Down</span>
            </div>
            <div class="legend-item">
                <div class="legend-color non-rtis"></div>
                <span>NON RTIS</span>
            </div>
            <div class="legend-item">
                <div class="legend-color ok"></div>
                <span>Analyzed OK</span>
            </div>
            <div class="legend-item">
                <div class="legend-color blank" style="display: flex; align-items: center; justify-content: center; font-weight: 600; color: var(--text-light);">X</div>
                <span>Not in beat</span>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-row">
            <div class="stat-card locos">
                <div class="stat-value" id="statLocos">-</div>
                <div class="stat-label">Locos Affected</div>
            </div>
            <div class="stat-card sim-down">
                <div class="stat-value" id="statSimDown">-</div>
                <div class="stat-label">SIM Down Incidents</div>
            </div>
            <div class="stat-card non-rtis">
                <div class="stat-value" id="statNonRtis">-</div>
                <div class="stat-label">NON RTIS Incidents</div>
            </div>
        </div>

        <!-- Table -->
        <div class="table-card">
            <div class="table-header">
                <h3>Weekly Status Report</h3>
                <button class="btn btn-success" onclick="exportReport()">
                    <i class="fas fa-download"></i> Export CSV
                </button>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr id="tableHeaderRow">
                            <th>Rly</th>
                            <th>Base Shed</th>
                            <th>Loco No.</th>
                            <th>Type</th>
                            <!-- Date columns will be added dynamically -->
                        </tr>
                    </thead>
                    <tbody id="reportTableBody">
                        <tr><td colspan="11" class="loading"><i class="fas fa-spinner fa-spin"></i> Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        const API_BASE = window.location.pathname.includes('/spm/rtis') ? '/spm/rtis' : '';
        let currentWeekStart = '';
        let currentWeekEnd = '';
        let reportData = [];
        let weekDates = [];
        let flexibleMode = false;

        document.addEventListener('DOMContentLoaded', () => {
            goToCurrentWeek();
        });

        function toggleFlexibleDates() {
            flexibleMode = document.getElementById('flexibleDatesCheckbox').checked;
            const weekNav = document.getElementById('weekNav');
            const flexibleToggle = document.getElementById('flexibleToggle');
            const dateRangeLabel = document.getElementById('dateRangeLabel');

            if (flexibleMode) {
                weekNav.classList.add('hidden');
                flexibleToggle.classList.add('active');
                dateRangeLabel.innerHTML = '<i class="fas fa-calendar-alt"></i> Select Range:';
            } else {
                weekNav.classList.remove('hidden');
                flexibleToggle.classList.remove('active');
                dateRangeLabel.innerHTML = '<i class="fas fa-calendar"></i> Select Week:';
                goToCurrentWeek();
            }
        }

        function handleStartDateChange() {
            if (flexibleMode) {
                // In flexible mode, just reload with whatever dates are selected
                loadReport();
            } else {
                // In week mode, snap to Thu-Wed
                updateWeekFromDate();
            }
        }

        function handleEndDateChange() {
            if (flexibleMode) {
                // In flexible mode, just reload
                loadReport();
            }
            // In week mode, end date change is ignored (auto-calculated)
        }

        function getThursday(d) {
            // Parse date string safely to avoid timezone issues
            let date;
            if (typeof d === 'string') {
                const parts = d.split('-');
                date = new Date(parts[0], parts[1] - 1, parts[2]);
            } else {
                date = new Date(d);
            }
            const day = date.getDay();
            // Thursday = 4. Calculate days to go back to reach Thursday
            const daysBack = (day - 4 + 7) % 7;
            const thursday = new Date(date);
            thursday.setDate(date.getDate() - daysBack);
            return thursday;
        }

        function getWednesday(thursday) {
            const wednesday = new Date(thursday);
            wednesday.setDate(thursday.getDate() + 6);
            return wednesday;
        }

        function formatDate(date) {
            // Use local date components to avoid UTC conversion
            const year = date.getFullYear();
            const month = (date.getMonth() + 1).toString().padStart(2, '0');
            const day = date.getDate().toString().padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function parseLocalDate(dateStr) {
            // Parse YYYY-MM-DD string as local date (not UTC)
            const parts = dateStr.split('-');
            return new Date(parts[0], parts[1] - 1, parts[2]);
        }

        function formatDisplayDate(dateStr) {
            const d = parseLocalDate(dateStr);
            return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short' }).replace(' ', '-');
        }

        function formatHeaderDate(dateStr) {
            const d = parseLocalDate(dateStr);
            const day = d.getDate().toString().padStart(2, '0');
            const month = (d.getMonth() + 1).toString().padStart(2, '0');
            const year = d.getFullYear().toString().slice(-2);
            return `${day}-${month}-${year}`;
        }

        function setWeek(startDate) {
            const thursday = getThursday(startDate);
            const wednesday = getWednesday(thursday);
            currentWeekStart = formatDate(thursday);
            currentWeekEnd = formatDate(wednesday);
            document.getElementById('weekStartInput').value = currentWeekStart;
            document.getElementById('weekEndInput').value = currentWeekEnd;
            loadReport();
        }

        function goToCurrentWeek() {
            setWeek(new Date());
        }

        function goToPreviousWeek() {
            const parts = currentWeekStart.split('-');
            const current = new Date(parts[0], parts[1] - 1, parts[2]);
            current.setDate(current.getDate() - 7);
            setWeek(current);
        }

        function goToNextWeek() {
            const parts = currentWeekStart.split('-');
            const current = new Date(parts[0], parts[1] - 1, parts[2]);
            current.setDate(current.getDate() + 7);
            setWeek(current);
        }

        function updateWeekFromDate() {
            const selectedDate = document.getElementById('weekStartInput').value;
            if (selectedDate) {
                setWeek(selectedDate);
            }
        }

        async function loadReport() {
            currentWeekStart = document.getElementById('weekStartInput').value;
            currentWeekEnd = document.getElementById('weekEndInput').value;

            if (!currentWeekStart || !currentWeekEnd) return;

            document.getElementById('reportTableBody').innerHTML =
                '<tr><td colspan="11" class="loading"><i class="fas fa-spinner fa-spin"></i> Loading...</td></tr>';

            try {
                const res = await fetch(`${API_BASE}/api/sim-down-weekly?week_start=${currentWeekStart}&week_end=${currentWeekEnd}`);
                const data = await res.json();

                if (data.success) {
                    reportData = data.locos || [];
                    weekDates = data.dates || [];
                    updateTableHeader(weekDates);
                    updateStats(reportData);
                    renderTable(reportData, weekDates);
                } else {
                    showToast(data.error || 'Failed to load report', 'error');
                }
            } catch (e) {
                console.error('Load report error:', e);
                document.getElementById('reportTableBody').innerHTML =
                    '<tr><td colspan="11" class="empty-state"><i class="fas fa-exclamation-triangle"></i><br>Failed to load report</td></tr>';
            }
        }

        function updateTableHeader(dates) {
            const headerRow = document.getElementById('tableHeaderRow');
            // Keep first 4 columns, add date columns
            headerRow.innerHTML = `
                <th>Rly</th>
                <th>Base Shed</th>
                <th>Loco No.</th>
                <th>Type</th>
                ${dates.map(d => `<th>${formatHeaderDate(d)}</th>`).join('')}
            `;
        }

        function updateStats(locos) {
            const totalLocos = locos.length;
            const totalSimDown = locos.reduce((sum, l) => sum + (l.sim_down_count || 0), 0);
            const totalNonRtis = locos.reduce((sum, l) => sum + (l.non_rtis_count || 0), 0);

            document.getElementById('statLocos').textContent = totalLocos;
            document.getElementById('statSimDown').textContent = totalSimDown;
            document.getElementById('statNonRtis').textContent = totalNonRtis;
        }

        function renderTable(locos, dates) {
            const tbody = document.getElementById('reportTableBody');
            const colCount = 4 + dates.length;

            if (!locos || locos.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${colCount}" class="empty-state"><i class="fas fa-check-circle"></i><br>No SIM Down or NON RTIS locos for this week</td></tr>`;
                return;
            }

            tbody.innerHTML = locos.map(l => `
                <tr>
                    <td>${l.rly || 'CR'}</td>
                    <td>${l.base_shed || '-'}</td>
                    <td class="loco-number">${l.loco_number}</td>
                    <td>${l.loco_type || '-'}</td>
                    ${dates.map(d => {
                        const status = l.daily_status[d] || '';
                        let cellClass = 'status-cell';
                        let displayText = '';
                        if (status === 'SIM Down') {
                            cellClass += ' sim-down';
                            displayText = 'SIM Down';
                        } else if (status === 'NON RTIS') {
                            cellClass += ' non-rtis';
                            displayText = 'NON RTIS';
                        } else if (status === 'OK') {
                            cellClass += ' ok';
                            displayText = 'OK';
                        } else {
                            cellClass += ' not-in-beat';
                            displayText = 'X';
                        }
                        return `<td class="${cellClass}">${displayText}</td>`;
                    }).join('')}
                </tr>
            `).join('');
        }

        function exportReport() {
            if (!reportData || reportData.length === 0) {
                showToast('No data to export', 'error');
                return;
            }

            // CSV header
            let csv = 'Rly,Base Shed,Loco No.,Type,' + weekDates.map(d => formatHeaderDate(d)).join(',') + '\n';

            // CSV rows
            reportData.forEach(l => {
                const row = [
                    l.rly || 'CR',
                    l.base_shed || '',
                    l.loco_number,
                    l.loco_type || ''
                ];
                weekDates.forEach(d => {
                    row.push(l.daily_status[d] || '');
                });
                csv += row.map(v => `"${v}"`).join(',') + '\n';
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `sim_down_weekly_${currentWeekStart}_to_${currentWeekEnd}.csv`;
            a.click();
            window.URL.revokeObjectURL(url);
            showToast('Report exported', 'success');
        }

        function showToast(message, type = '') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show ' + type;
            setTimeout(() => { toast.className = 'toast'; }, 3000);
        }
    </script>
</body>
</html>
